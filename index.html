<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAS Education ERP</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div><h1>LAS Education ERP</h1><p>نظام إدارة المرافق التعليمية – غزة</p></div><div class="session"><select id="roleSelect"><option value="admin">الإدارة المركزية</option><option value="manager">مدير مرفق</option></select><select id="facilitySelect"></select></div></header><main><section id="adminStats" class="stats"></section><section class="panel"><div class="panel-head"><h2 id="viewTitle">المرافق التعليمية</h2><div class="actions"><button id="addStudentBtn">+ تسجيل طالب</button><button id="backupBtn" class="secondary">تصدير نسخة احتياطية CSV</button></div></div><div id="facilityCards" class="facility-grid"></div><div id="facilityView" class="hidden"><div id="facilityHero" class="facility-hero"></div><div id="facilityStats" class="stats compact"></div><div class="tabs"><button data-tab="students" class="active">الطلاب</button><button data-tab="stages">المراحل والشعب</button><button data-tab="finance">المالية</button><button data-tab="backup">النسخ الاحتياطي</button></div><div id="tabContent"></div></div></section></main><dialog id="studentDialog"><form method="dialog" id="studentForm"><h3>تسجيل طالب</h3><label>الاسم الكامل<input name="name" required></label><label>المرحلة<input name="stage" placeholder="مثال: الصف الثالث" required></label><label>الشعبة<input name="section" placeholder="أ" required></label><label>الهاتف<input name="phone"></label><label>المبلغ المدفوع<input type="number" name="paid" value="0" min="0"></label><label>المبلغ المتبقي<input type="number" name="balance" value="0" min="0"></label><menu><button value="cancel" class="secondary">إلغاء</button><button value="default" id="saveStudentBtn">حفظ</button></menu></form></dialog><script src="app.js"></script></body></html>
